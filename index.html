<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="topbar-left">
                <div class="avatar-ring">
                    <img src="ai.png" alt="AI" class="topbar-avatar">
                </div>
                <div class="topbar-info">
                    <span class="topbar-name">Assistant</span>
                    <span class="topbar-status">Online</span>
                </div>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="ai-chat-box">
                <div class="bubble-wrap">
                    <img src="ai.png" alt="AI" class="bubble-avatar">
                    <div class="ai-bubble">
                        Hello. How can I help you today?
                    </div>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <button class="icon-btn" id="image" title="Attach image">
                <img src="img.svg" alt="attach" class="icon-svg" id="attachIcon">
                <input type="file" accept="image/*" hidden>
            </button>
            <input type="text" id="prompt" placeholder="Type a message" autocomplete="off">
            <button class="send-btn" id="submit" title="Send">
                <img src="submit.svg" alt="send" class="icon-svg">
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
